* { margin:0; padding:0; box-sizing:border-box; }

html, body { height:100%; }

body {

  color: #c9d1d9;
  display:flex; flex-direction:column;

/* Scanlines overlay */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:1000;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.03) 2px, rgba(0,0,0,.03) 4px);
}

/* ── Title bar ── */
.titlebar {
  background: #161b22; border-bottom: 1px solid #21262d;
  padding: .6rem 1rem;
  display:flex; align-items:center; gap:.8rem;
  flex-shrink:0;
}

.dots { display:flex; gap:.4rem; }
.dot { width:12px;height:12px;border-radius:50%; }
.dot-r { background:#ff5f57; }
.dot-y { background:#ffbd2e; }
.dot-g { background:#28ca41; }

.titlebar-text {
  flex:1; text-align:center; font-size:.75rem; color:#8b949e;
}

.titlebar-badge {
  font-size:.65rem; background:rgba(0,255,136,.1); color:#00ff88;
  border:1px solid rgba(0,255,136,.2); border-radius:4px; padding:.15rem .5rem;
}

/* ── Terminal body ── */
.terminal {
  flex:1; display:flex; flex-direction:column; overflow:hidden;
  position:relative;
}

/* Matrix canvas behind terminal */
#matrix { position:absolute; inset:0; opacity:.06; pointer-events:none; }

/* ── Output area ── */
.output {
  flex:1; overflow-y:auto; padding:1.2rem 1.5rem;
  position:relative; z-index:1;
  scroll-behavior:smooth;
}

.output::-webkit-scrollbar { width:4px; }
.output::-webkit-scrollbar-track { background:#0a0e17; }
.output::-webkit-scrollbar-thumb { background:#21262d; border-radius:2px; }

/* ── Input bar ── */
.input-bar {
  display:flex; align-items:center; gap:.5rem;
  padding:.8rem 1.5rem; border-top:1px solid #21262d;
  background:#0d1117; flex-shrink:0; position:relative; z-index:1;
}

.prompt-label { color:#00ff88; font-size:.85rem; white-space:nowrap; }

.cmd-input {
  flex:1; background:transparent; border:none; outline:none;
  font-family:'JetBrains Mono',monospace; font-size:.85rem; color:#e6edf3;
  caret-color:#00ff88;
}

/* ── Output line types ── */
.line { margin-bottom:.2rem; font-size:.83rem; line-height:1.6; }

.line-cmd  { color:#e6edf3; }
.line-cmd::before { content:'❯ '; color:#00ff88; }

.line-info { color:#8b949e; }
.line-success { color:#00ff88; }
.line-err  { color:#ff5555; }
.line-warn { color:#f1fa8c; }
.line-key  { color:#bd93f9; }
.line-val  { color:#e6edf3; }
.line-cyan { color:#00d4ff; }
.line-link { color:#58a6ff; text-decoration:underline; cursor:pointer; }
.line-blank { height:.6rem; }
.line-sep { color:#21262d; user-select:none; }
.line-bold { font-weight:700; }

/* ASCII art */
.ascii { color:#00ff88; font-size:.65rem; line-height:1.3; white-space:pre; }

/* Metric highlight box */
.metric-box {
  display:inline-block; background:rgba(0,255,136,.08);
  border:1px solid rgba(0,255,136,.2); border-radius:4px;
  padding:.1rem .5rem; color:#00ff88; font-weight:700;
}

/* Skill group row */
.skill-row { padding:.1rem 0; }
.skill-cat { color:#bd93f9; }
.skill-list-txt { color:#8b949e; }

/* Experience entry */
.exp-entry { margin:.4rem 0; padding:.6rem 1rem; border-left:2px solid #00ff88; }
.exp-role-t { color:#e6edf3; font-weight:700; }
.exp-co     { color:#00d4ff; }
.exp-period { color:#8b949e; font-size:.75rem; }
.exp-pts    { color:#8b949e; margin-top:.3rem; padding-left:.5rem; }
.exp-pts li { margin:.15rem 0; list-style:none; }
.exp-pts li::before { content:'▸ '; color:#00ff88; }
.ic { display:inline-block; background:rgba(0,212,255,.1); border:1px solid rgba(0,212,255,.2); border-radius:3px; padding:.05rem .35rem; color:#00d4ff; font-size:.72rem; margin:.1rem; }

/* Typing cursor */
.cursor { display:inline-block; width:7px; height:.9em; background:#00ff88; vertical-align:middle; animation:blink 1s step-end infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }

/* Tab hints */
.hint-bar {
  padding:.4rem 1.5rem; background:#0d1117; border-top:1px solid #161b22;
  font-size:.68rem; color:#4a5568; display:flex; gap:1.5rem; flex-shrink:0;

/* Autocomplete dropdown */

.ac-item {

.ac-item:hover, .ac-item.selected { background:#21262d; }
.ac-item .ac-cmd { color:#00ff88; }
.ac-item .ac-desc { color:#8b949e; font-size:.7rem; }
</style>

const drops = Array(COLS).fill(1);
const CH = 'アイウエカKUBERNETESTERRAFORMDOCKERAWSAZUREGCPPYTHONREACT01'.split('');

  mctx.fillStyle = 'rgba(10,14,23,.06)';
  mctx.fillRect(0, 0, mc.width, mc.height);
  mctx.fillStyle = '#00ff88'; mctx.font = '12px JetBrains Mono, monospace';
  drops.forEach((y, i) => {
    mctx.fillText(CH[Math.floor(Math.random()*CH.length)], i*14, y*14);
    if (y*14 > mc.height && Math.random() > .975) drops[i] = 0;
    drops[i]++;
  });
}

/* ── Command runner ── */
function run(raw) {
  const cmd = raw.trim().toLowerCase();
  if (!cmd) return;
  blank();
  line('line-cmd', raw);
  if (history[history.length-1] !== raw) history.push(raw);
  histIdx = history.length;

  if (cmd.startsWith('echo ')) {
    line('line-val', raw.slice(5));
  } else if (CMDS[cmd]) {
    CMDS[cmd].run();
  } else {
    line('line-err', `command not found: ${cmd}. Type <span style="color:#00ff88">help</span> for available commands.`);
    blank();
  }
  scroll();
}

/* ── Input handling ── */
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    closeAC();
    const v = input.value;
    input.value = '';
    run(v);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
    else { histIdx = history.length; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    if (acMatches.length) {
      acIdx = (acIdx + 1) % acMatches.length;
      input.value = acMatches[acIdx];
      highlightAC();
    }
  } else if (e.ctrlKey && e.key === 'l') {
    e.preventDefault(); CMDS.clear.run();
  }
});

input.addEventListener('input', () => {
  const v = input.value.toLowerCase();
  if (!v) { closeAC(); return; }
  acMatches = Object.keys(CMDS).filter(k => k.startsWith(v) && k !== v);
  acIdx = -1;
  if (acMatches.length) {
    acBox.innerHTML = acMatches.slice(0,6).map((m, i) =>
      `<div class="ac-item" data-idx="${i}">
        <span class="ac-cmd">${m}</span>
        <span class="ac-desc"> — ${CMDS[m].desc}</span>
      </div>`
    ).join('');
    acBox.style.display = 'block';
  } else { closeAC(); }
});

acBox.addEventListener('click', e => {
  const item = e.target.closest('.ac-item');
  if (item) { input.value = acMatches[+item.dataset.idx]; closeAC(); input.focus(); }
});

function closeAC() { acBox.style.display = 'none'; acMatches = []; acIdx = -1; }

function highlightAC() {
  acBox.querySelectorAll('.ac-item').forEach((el, i) => {
    el.classList.toggle('selected', i === acIdx);
  });
}

document.addEventListener('click', e => {
  if (!acBox.contains(e.target) && e.target !== input) closeAC();
});

/* ── Boot ── */
boot();
</script>
